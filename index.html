<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Dla Lili ❤️</title>
<style>
    body {
        margin: 0;
        background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
        font-family: Arial;
        color: white;
        overflow: hidden;
    }

    .container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 100vh;
        padding: 20px;
    }

    .side-img {
        width: 25%;
        border-radius: 20px;
        box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    .center {
        text-align: center;
        width: 50%;
    }

    h1 {
        font-size: 50px;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }

    .counter {
        margin-top: 15px;
        font-size: 26px;
        font-weight: bold;
    }

    .text {
        margin-top: 20px;
        font-size: 22px;
    }

    button {
        margin-top: 25px;
        padding: 15px 30px;
        font-size: 20px;
        border: none;
        border-radius: 20px;
        background: white;
        color: #ff4b5c;
        cursor: pointer;
    }

    .heart {
        position: absolute;
        color: red;
        animation: float 6s linear infinite;
    }

    @keyframes float {
        from { transform: translateY(100vh); }
        to { transform: translateY(-10vh); }
    }
</style>
</head>
<body>

<div class="container">

    <!-- LEWE ZDJĘCIE -->
    <img src="lewe.jpg" class="side-img">

    <!-- ŚRODEK -->
    <div class="center">
        <h1>Lili, Kocham cię!!!!!!!❤️</h1>
        <div class="counter" id="daysTogether"></div>
        <div class="counter" id="relationshipTime"></div>
        
        <div class="text">
            Kocham cię! <br>
            I love you! <br>
            Te amo! <br>
            Je t’aime~! <br>
            Ich liebe dich! <br>
            Ti amo! <br>
            Я тебя люблю! <br>
            愛してる! <br>
            사랑해! <br>
            我爱你! 
        </div>

        <button onclick="showMessage()">Kliknij mnie 💌</button>
        <br><br>
<button onclick="openCertificate()">Certyfikat 📜</button>
    </div>

    <!-- PRAWE ZDJĘCIE -->
    <img src="prawe.jpg" class="side-img">

</div>

<script>
// LICZNIK DNI
const startDate = new Date("2026-02-28");
const today = new Date();

const diffTime = today - startDate;
const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

document.getElementById("daysTogether").innerText =
    "Znamy się już " + diffDays + " dni ❤️";
// LICZNIK ZWIĄZKU
const relationshipStart = new Date("2026-04-17");
const now = new Date();

const diffTimeRel = now - relationshipStart;
const diffDaysRel = Math.floor(diffTimeRel / (1000 * 60 * 60 * 24));

document.getElementById("relationshipTime").innerText =
    "Jesteśmy razem już " + diffDaysRel + " dni :> ❤️ ";
    
// WIADOMOŚĆ
function showMessage() {
    alert("Popełniłem błąd, oby to był ostatni, mam nadzieje że nie będziesz widzieć tego błędu przed oczami patrząc na mnie bardzo mocno tego żałuje. Kocham cie nad życie i nie chce cie stracić. Jesteś moją myszką!!! <3 ");
}

// "KOCHAM CIĘ" – DUŻO JĘZYKÓW (1 kraj = 1 język)
const loveTexts = [
"Kocham cię",
"I love you",
"Te amo",
"Je t’aime",
"Ich liebe dich",
"Ti amo",
"Eu te amo",
"Te iubesc",
"Szeretlek",
"Miluji tě",
"Ľúbim ťa",
"Volim te",
"Ljubim te",
"Obožavam te",
"Обичам те",
"Σε αγαπώ",
"Seni seviyorum",
"Я тебя люблю",
"Я тебе кохаю",
"Я цябе кахаю",
"Ma armastan sind",
"Aš tave myliu",
"Es tevi mīlu",
"Jeg elsker dig",
"Jeg elsker deg",
"Jag älskar dig",
"Rakastan sinua",
"Ég elska þig",
"Ik hou van jou",
"Ich han di gärn",
"Mi amas vin",
"T’estimo",
"T’estime",
"Te iubesc mult",
"Volim te puno",
"Ti voglio bene",
"Amo-te",
"Jeg elsker deg høyt",
"Ja tebe ljubim",
"Te sakam",
"Obicham te mnogo",
"Men seni seviyorum",
"Te dua",
"Unë të dua",
"Ja ljublju tebja",
"Sto s’agapo",
"Te quiero mucho",
"Jag tycker om dig",
"Ik zie je graag",
"Mi te amo",
"Te am"
];

// SERDUSZKA → TEKST
function createHeart() {
    const heart = document.createElement("div");
    heart.innerHTML = "❤️";
    heart.style.position = "absolute";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.bottom = "0px";
    heart.style.fontSize = (Math.random() * 20 + 20) + "px";
    heart.style.transition = "transform 3s linear, opacity 0.5s";
    document.body.appendChild(heart);

    // lecą wyżej (do połowy)
    setTimeout(() => {
        heart.style.transform = "translateY(-55vh)";
    }, 50);

    // w połowie zamiana w tekst
    setTimeout(() => {
        const randomText = loveTexts[Math.floor(Math.random() * loveTexts.length)];
        heart.innerHTML = randomText;
        heart.style.fontSize = "24px";
        heart.style.color = "white";
        heart.style.textShadow = "0 0 10px rgba(255,255,255,0.8)";
    }, 1500);

    // widoczne chwilę
    setTimeout(() => {
        heart.style.opacity = "0";
    }, 3000);

    setTimeout(() => {
        heart.remove();
    }, 3500);
}

// częstotliwość
setInterval(createHeart, 350);

    function openCertificate() {
    window.open("certyfikat.jpg", "_blank");
}
</script>

</body>
</html>
