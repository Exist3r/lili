<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Dla Lili ❤️</title>
<style>
body {
    margin: 0;
    background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
    font-family: Arial;
    color: white;
    overflow: hidden;
}

/* UKŁAD */
.container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 100vh;
    padding: 20px;
}

/* LEWA */
.left-side {
    width: 25%;
}

/* PRAWA */
.right-side {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 25%;
}

/* ZDJĘCIA – BEZ PRZYCINANIA */
.side-img {
    width: 100%;
    height: auto;
    object-fit: contain;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

/* ŚRODEK */
.center {
    text-align: center;
    width: 50%;
}

h1 {
    font-size: 50px;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

.counter {
    margin-top: 15px;
    font-size: 26px;
    font-weight: bold;
}

.text {
    margin-top: 20px;
    font-size: 22px;
}

button {
    margin-top: 25px;
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 20px;
    background: white;
    color: #ff4b5c;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

/* SERDUSZKA */
.heart {
    position: absolute;
}
</style>
</head>
<body>

<div class="container">

    <!-- LEWA -->
    <div class="left-side">
        <img src="lewe.jpg" class="side-img">
    </div>

    <!-- ŚRODEK -->
    <div class="center">
        <h1>Lili, Kocham cię!!!!!!! ❤️</h1>

        <div class="counter" id="daysTogether"></div>
        <div class="counter" id="relationshipTime"></div>

        <div class="text">
            Kocham cię! <br>
            I love you! <br>
            Te amo! <br>
            Je t’aime! <br>
            Ich liebe dich! <br>
            Ti amo! <br>
            Я тебя люблю! <br>
            愛してる! <br>
            사랑해! <br>
            我爱你!
        </div>

        <button onclick="showMessage()">Kliknij mnie 💌</button>
        <br><br>
        <button onclick="openCertificate()">Certyfikat 📜</button>
    </div>

    <!-- PRAWA -->
    <div class="right-side">
        <img src="prawe.jpg" class="side-img">
        <img src="fota2.jpg" class="side-img">
    </div>

</div>

<script>
// LICZNIK ZNAJOMOŚCI
const startDate = new Date("2026-02-28");
const today = new Date();
const diffDays = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));

document.getElementById("daysTogether").innerText =
    "Znamy się już " + diffDays + " dni ❤️";

// LICZNIK ZWIĄZKU
const relationshipStart = new Date("2026-04-17");
const diffDaysRel = Math.floor((today - relationshipStart) / (1000 * 60 * 60 * 24));

document.getElementById("relationshipTime").innerText =
    "Jesteśmy razem już " + diffDaysRel + " dni ❤️";

// WIADOMOŚĆ
function showMessage() {
    alert("Popełniłem błąd, oby to był ostatni... Kocham cię nad życie ❤️");
}

// TEKSTY
const loveTexts = [
"Kocham cię","I love you","Te amo","Je t’aime","Ich liebe dich","Ti amo",
"Eu te amo","Te iubesc","Szeretlek","Miluji tě","Ľúbim ťa","Volim te",
"Обичам te","Σε αγαπώ","Seni seviyorum","Я тебя люблю","Я тебе кохаю",
"Ma armastan sind","Aš tave myliu","Jeg elsker dig","Jag älskar dig",
"Rakastan sinua","Ik hou van jou","Te quiero","Te dua","Unë të dua"
];

// SERDUSZKA
function createHeart() {
    const el = document.createElement("div");
    el.innerHTML = "❤️";
    el.style.position = "absolute";
    el.style.left = Math.random() * 100 + "vw";
    el.style.bottom = "0";
    el.style.fontSize = (Math.random() * 20 + 20) + "px";
    el.style.transition = "transform 3s linear, opacity 0.5s";
    document.body.appendChild(el);

    setTimeout(() => {
        el.style.transform = "translateY(-55vh)";
    }, 50);

    setTimeout(() => {
        el.innerHTML = loveTexts[Math.floor(Math.random() * loveTexts.length)];
        el.style.fontSize = "24px";
    }, 1500);

    setTimeout(() => el.style.opacity = "0", 3000);
    setTimeout(() => el.remove(), 3500);
}

setInterval(createHeart, 350);

// CERTYFIKAT
function openCertificate() {
    window.open("certyfikat.jpg", "_blank");
}
</script>

</body>
</html>
